<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Practice Week</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Montserrat:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<header class="site-header" data-page="practice"></header>
<main class="wide">
  <div class="page-head">
    <h1 id="week-title">Practice week</h1>
    <span id="week-phase"></span>
  </div>
  <div class="toolbar no-print">
    <button type="button" class="secondary" id="prev" aria-label="Previous week">← Prev</button>
    <button type="button" class="secondary" id="this-week">This week</button>
    <button type="button" class="secondary" id="next" aria-label="Next week">Next →</button>
    <label class="visually-hidden" for="jump">Go to date</label>
    <input type="date" id="jump" style="width:auto">
    <span class="spacer"></span>
    <button type="button" class="secondary" onclick="window.print()">Print week</button>
  </div>
  <div id="week" class="week" aria-live="polite"><p class="empty">Loading…</p></div>
</main>
<footer class="site-footer"><span id="snapshot-status"></span></footer>
<script type="module" src="/js/app.js"></script>
<script type="module" src="/js/practice-week.js"></script>
</body>
</html>
