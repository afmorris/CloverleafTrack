name: Deploy Cloverleaf Coach

# coach.cloverleaftrack.com (Cloudflare Worker + D1). Separate from the Docker image build. BRAIN.md [C133].
on:
  push:
    branches: [main]
    paths: ["coach/**", ".github/workflows/coach-deploy.yml"]
  pull_request:
    paths: ["coach/**", ".github/workflows/coach-deploy.yml"]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: coach

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: coach/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck

  deploy:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v6
      - name: Check deploy setup
        id: ready
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || grep -q '00000000-0000-0000-0000-000000000000' wrangler.jsonc; then
            echo "::notice::Skipping deploy: set CLOUDFLARE_API_TOKEN/CLOUDFLARE_ACCOUNT_ID and the real D1 database_id (see coach/README.md)."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v5
        if: steps.ready.outputs.ok == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: coach/package-lock.json
      - if: steps.ready.outputs.ok == 'true'
        run: npm ci
      - name: Apply D1 migrations
        if: steps.ready.outputs.ok == 'true'
        run: npx wrangler d1 migrations apply cloverleaf-coach --remote
      - name: Deploy Worker
        if: steps.ready.outputs.ok == 'true'
        run: npx wrangler deploy
